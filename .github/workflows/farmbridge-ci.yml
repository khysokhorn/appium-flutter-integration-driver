name: FarmBridge CI

on:
  push:
    branches: [main, farmbridge-cross-platform]
    paths:
      - 'farmbridge/**'
      - '.github/workflows/farmbridge-ci.yml'
  pull_request:
    paths:
      - 'farmbridge/**'
      - '.github/workflows/farmbridge-ci.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farmbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify macOS host tools
        if: runner.os == 'macOS'
        env:
          APPIUM_HOME: ${{ runner.temp }}/farmbridge-appium
        run: |
          xcodebuild -version
          xcrun --find xctrace
          command -v adb || brew install --cask android-platform-tools
          adb version
          npm install -g appium
          appium driver install xcuitest
          appium driver list --installed
        working-directory: farmbridge
      - run: npm test
      - run: npm run check
      - name: Build native Mac application
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-app.sh
      - name: Smoke test bundled device bridge
        if: runner.os == 'macOS'
        run: |
          export PORT=18789
          export FARMBRIDGE_STATE="$RUNNER_TEMP/farmbridge-state.json"
          export FARMBRIDGE_STUDIO_STATE="$RUNNER_TEMP/farmbridge-studio.json"
          ./dist/FarmBridge.app/Contents/MacOS/node ./dist/FarmBridge.app/Contents/Resources/farmbridge/src/index.js > "$RUNNER_TEMP/farmbridge.log" 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18789/api/health; then exit 0; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/farmbridge.log"
          exit 1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: FarmBridge-macOS-AppleSilicon
          path: farmbridge/dist/FarmBridge-macOS-arm64.zip
          if-no-files-found: error
