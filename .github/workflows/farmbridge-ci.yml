name: FarmBridge CI

on:
  push:
    branches: [main, farmbridge-cross-platform]
    paths:
      - 'farmbridge/**'
      - '.github/workflows/farmbridge-ci.yml'
  pull_request:
    paths:
      - 'farmbridge/**'
      - '.github/workflows/farmbridge-ci.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farmbridge
    env:
      APPIUM_HOME: ${{ runner.temp }}/farmbridge-appium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify macOS host tools
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --find xctrace
          command -v adb || brew install android-platform-tools
          adb version
          npm install -g appium
          appium driver install xcuitest
          appium driver list --installed
        working-directory: farmbridge
      - run: npm test
      - run: npm run check
