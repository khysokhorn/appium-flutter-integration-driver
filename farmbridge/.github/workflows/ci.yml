name: FarmBridge CI

on:
  push:
    paths:
      - 'farmbridge/**'
  pull_request:
    paths:
      - 'farmbridge/**'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farmbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/farmbridge.mjs
